<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Hotel Analytics ML{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/ui">Hotel Analytics ML</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="/ui">Strona główna</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ui/clusters">Klastry</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ui/recommendations#recommendations">Rekomendacje</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ui/recommendations#search">Wyszukiwanie hoteli</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ui/sentiment">Klasyfikacja opinii</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ui/predict-cluster">Predykcja klastra</a></li>
                    <li class="nav-item"><a class="btn btn-outline-light btn-sm ms-lg-2" href="/docs">API Docs</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main>{% block content %}{% endblock %}</main>
    <footer class="py-4 mt-5"><div class="container text-center text-secondary">Projekt studencki EDI · Hotel Analytics ML</div></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', path='/js/app.js') }}"></script>
</body>
</html>
